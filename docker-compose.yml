# Runs Zemen with PostgreSQL — the production-style setup.
# For zero-setup local development you can skip Docker entirely:
# just leave DATABASE_URL empty and the app uses SQLite automatically.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zemen
      POSTGRES_PASSWORD: zemen
      POSTGRES_DB: zemen
    ports:
      - "5432:5432"
    volumes:
      - zemen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zemen"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://zemen:zemen@db:5432/zemen
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DEV_MODE: "false"
    ports:
      - "3001:3001"

volumes:
  zemen_pgdata:
